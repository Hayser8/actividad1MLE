name: Verificar pipeline en Windows y Ubuntu

on:
  push:
    branches: ["main", "codex/spotify-pipeline"]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar paquete y herramientas
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Construir wheel y distribución fuente
        run: python -m build

      - name: Entrenar y generar captura de evidencia
        run: spotify-train Most_Streamed_Spotify_Songs_2024.csv --output-dir artifacts

      - name: Publicar evidencia del runner
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            artifacts/execution_evidence.json
            artifacts/execution_evidence.png
            artifacts/metrics.json
            artifacts/predictions.csv
            artifacts/pipeline.joblib
            dist/*
          if-no-files-found: error
          retention-days: 30
