[project]
name = "spotify-sklearn-pipeline"
version = "0.1.0"
description = "Pipeline reproducible de scikit-learn para canciones de Spotify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jupyter>=1.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0",
]

[project.scripts]
spotify-train = "spotify_sklearn_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_sklearn_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
